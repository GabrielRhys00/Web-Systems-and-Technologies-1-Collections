<!DOCTYPE html>

<head>Voting Eligibility Checker</head>

<body>
    <script>
        let age = Number(prompt("What is your age?"));

        if (age >= 18 && age <= 100) {
            alert("You are eligible to vote");
        } else if (age >= 1 && age <= 17) {
            alert("You are not eligible");
        } else {
            alert("Invalid input");
        }
    </script>
</body>

</html>
